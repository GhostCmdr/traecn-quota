name: publish

on:
  push:
    tags:
      - 'v*'
    branches:
      - ci-debug   # 临时：github.com 直连被拦时用 API 推分支来跑 CI 定位问题，定位完删掉

permissions:
  contents: read
  issues: write   # 仅下面那个临时调试步骤用来开 issue 贴日志，定位完就删

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与本地开发一致。测试脚本里的 "test/**/*.test.js" 由 Node 自己展开，
          # glob 支持要 Node 21+，用 20 会当成模块路径去找 → 整步直接报错
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag 是 v$tag，package.json 是 $version，不一致，拒绝发布。" >&2
            exit 1
          fi

      - name: 单元测试
        id: unit
        shell: bash
        run: set -o pipefail; npm run test:unit 2>&1 | tee "$RUNNER_TEMP/unit.log"

      # 临时调试：本地看不到 Linux 上的失败详情，贴成 issue 供排查。定位后整段删掉
      - name: 失败时把日志贴到 issue
        if: failure() && steps.unit.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### CI 单测失败（run #$GITHUB_RUN_NUMBER, commit ${GITHUB_SHA:0:7}）"
            echo '```'
            tail -c 18000 "$RUNNER_TEMP/unit.log"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh issue create --title "CI 单测失败 run #$GITHUB_RUN_NUMBER" --body-file "$RUNNER_TEMP/body.md"

      - name: 打包
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: 发布到 Marketplace
        run: npx --yes @vscode/vsce publish --no-dependencies --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
