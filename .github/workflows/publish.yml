name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与本地开发一致。测试脚本里的 "test/**/*.test.js" 由 Node 自己展开，
          # glob 支持要 Node 21+，用 20 会当成模块路径去找 → 整步直接报错
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 校验 tag 与 package.json 版本一致
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag 是 v$tag，package.json 是 $version，不一致，拒绝发布。" >&2
            exit 1
          fi

      - name: 单元测试
        # 像素级布局校验（npm test 里的 preview/measure-*.js）断言的是 Segoe UI +
        # Microsoft YaHei 下的墨迹间距，CI 机器没这两款字体，量出来必然不同——
        # 那是本机设计常量的回归门，留在提交前本地跑（npm test）。
        run: npm run test:unit

      - name: 打包
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: 发布到 Marketplace
        run: npx --yes @vscode/vsce publish --no-dependencies --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
